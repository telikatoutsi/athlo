<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0f10">
  <title>Check-in · Athlo</title>
  <link rel="icon" href="img/athlo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <div>
      <h1>Check-in</h1>
      <p class="muted">Daily weigh-ins for 17 weeks. Weekly averages are calculated automatically.</p>
    </div>
    <button class="btn small" id="csv" type="button">Export CSV</button>
  </div>

  <section>
    <div class="card">
      <div class="settings-row">
        <label class="field">Week 1 starts on
          <input type="date" id="start">
        </label>
        <p class="muted" style="font-size:.88rem">Set the start date and every day's date fills in for you.</p>
      </div>
    </div>
  </section>

  <section>
    <div class="grid grid-4" id="stats"></div>
  </section>

  <section>
    <div class="card">
      <div class="section-title"><h2>Weekly average weight</h2></div>
      <div class="chart-wrap" id="chart"></div>
    </div>
  </section>

  <section>
    <div class="section-title"><h2>Weeks</h2></div>
    <div class="grid" id="weeks"></div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/checkin-core.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const A = App, C = Checkin, D = A.D;
  const DAYS = A.WEEKDAYS;
  let d = C.data();

  const startEl = document.getElementById("start");
  startEl.value = d.start;
  startEl.onchange = () => { d.start = startEl.value; C.store(d); renderWeeks(); A.toast("Start date saved"); };

  function currentWeek() {
    if (!d.start) return null;
    const days = Math.floor((Date.now() - new Date(d.start + "T00:00:00")) / 86400000);
    if (days < 0) return 1;
    const w = Math.floor(days / 7) + 1;
    return w > D.weeks ? null : w;
  }

  function renderStats() {
    const s = C.summary(d);
    const total = Object.values(d.entries).filter(e => A.num(e.weight) != null).length;
    const items = [
      ["Starting average", s.first ? A.fmtKg(s.first.avg) : "–", s.first ? "Week " + s.first.week : ""],
      ["Latest average", s.last ? A.fmtKg(s.last.avg) : "–", s.last ? "Week " + s.last.week : ""],
      ["Change", s.change == null ? "–" : (s.change > 0 ? "+" : "") + s.change.toFixed(1) + " kg", ""],
      ["Weigh-ins", total, "of " + D.weeks * 7]
    ];
    document.getElementById("stats").innerHTML = items.map(([l, v, sub]) =>
      `<div class="card stat"><div class="label">${l}</div><div class="value">${v}</div>${sub ? `<div class="muted" style="font-size:.82rem">${sub}</div>` : ""}</div>`
    ).join("");
  }

  function renderChart() {
    const wk = C.weekly(d);
    const pts = wk.filter(x => x.avg != null);
    const el = document.getElementById("chart");
    if (!pts.length) { el.innerHTML = '<div class="chart-empty">The chart appears after the first weigh-in.</div>'; return; }
    const wide = document.getElementById("chart").clientWidth > 600;
    const W = wide ? 960 : 400, H = wide ? 300 : 250, L = 44, R = 14, T = 16, B = 30;
    let min = Math.min(...pts.map(p => p.avg)), max = Math.max(...pts.map(p => p.avg));
    if (max - min < 2) { const m = (max + min) / 2; min = m - 1; max = m + 1; }
    const pad = (max - min) * 0.12; min -= pad; max += pad;
    const x = w => L + (w - 1) / (D.weeks - 1) * (W - L - R);
    const y = v => T + (max - v) / (max - min) * (H - T - B);
    let grid = "";
    for (let i = 0; i <= 4; i++) {
      const v = min + (max - min) * i / 4, yy = y(v).toFixed(1);
      grid += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#2b2b29"/><text x="${L - 8}" y="${+yy + 4}" text-anchor="end" fill="#9c9a93" font-size="11">${v.toFixed(1)}</text>`;
    }
    let xl = "";
    for (let w = 1; w <= D.weeks; w += (wide ? 2 : 4)) xl += `<text x="${x(w).toFixed(1)}" y="${H - 8}" text-anchor="middle" fill="#9c9a93" font-size="11">W${w}</text>`;
    const path = pts.map((p, i) => (i ? "L" : "M") + x(p.week).toFixed(1) + " " + y(p.avg).toFixed(1)).join(" ");
    const dots = pts.map(p => `<circle cx="${x(p.week).toFixed(1)}" cy="${y(p.avg).toFixed(1)}" r="4.5" fill="#3cb4c6" stroke="#1a1a19" stroke-width="2"><title>Week ${p.week}: ${p.avg.toFixed(1)} kg</title></circle>`).join("");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly average weight">${grid}${xl}
      <path d="${path}" fill="none" stroke="#3cb4c6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
  }

  function weekSummary(w) {
    const a = C.weekly(d)[w - 1];
    return a.avg == null ? '<span>No entries</span>' : `<b>${A.fmtKg(a.avg)}</b><br><span>${a.count}/7 days</span>`;
  }

  function renderWeeks() {
    const cw = currentWeek();
    let openWeek = cw;
    if (!openWeek) { // first week that isn't complete
      openWeek = 1;
      for (let w = 1; w <= D.weeks; w++) { if (C.weekly(d)[w - 1].count < 7) { openWeek = w; break; } }
    }
    let html = "";
    for (let w = 1; w <= D.weeks; w++) {
      let rows = `<div class="day-row header"><span>Day</span><span>Date</span><span>Weight (kg)</span><span>Time</span></div>`;
      for (let i = 0; i < 7; i++) {
        const k = C.key(w, i), e = d.entries[k] || {};
        const date = e.date || C.autoDate(d.start, w, i);
        rows += `<div class="day-row">
          <div class="dl">${DAYS[i]}${date ? `<small>${new Date(date + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</small>` : ""}</div>
          <label class="f-date"><span class="m-label">Date</span><input type="date" data-k="${k}" data-f="date" value="${A.esc(date)}"></label>
          <label><span class="m-label">Weight (kg)</span><input inputmode="decimal" placeholder="kg" data-k="${k}" data-f="weight" value="${A.esc(e.weight || "")}"></label>
          <label><span class="m-label">Time</span><input type="time" data-k="${k}" data-f="time" value="${A.esc(e.time || "")}"></label>
        </div>`;
      }
      html += `<details class="card week-card" data-w="${w}"${w === openWeek ? " open" : ""}>
        <summary><span class="wk">Week ${w}${w === cw ? ' <span class="pill teal">This week</span>' : ""}</span>
          <span style="display:flex;align-items:center;gap:12px"><span class="avg" id="avg-${w}">${weekSummary(w)}</span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>
        </summary>
        <div class="rows">${rows}</div>
      </details>`;
    }
    document.getElementById("weeks").innerHTML = html;
  }

  document.getElementById("weeks").addEventListener("change", e => {
    const inp = e.target.closest("[data-k]"); if (!inp) return;
    const k = inp.dataset.k, f = inp.dataset.f;
    let v = inp.value.trim();
    if (f === "weight" && v) {
      const n = A.num(v);
      if (n == null || n <= 0 || n > 400) { A.toast("Enter a weight in kg, e.g. 82.4"); inp.value = (d.entries[k] || {}).weight || ""; return; }
      v = String(n); inp.value = v;
    }
    d.entries[k] = Object.assign({}, d.entries[k], { [f]: v });
    if (!d.entries[k].date && !d.entries[k].weight && !d.entries[k].time) delete d.entries[k];
    C.store(d);
    const w = +k.split("-")[0];
    document.getElementById("avg-" + w).innerHTML = weekSummary(w);
    renderStats(); renderChart();
    A.toast("Saved");
  });

  document.getElementById("csv").onclick = () => {
    const lines = [["Week", "Day", "Date", "Weight (kg)", "Time", "Week average (kg)"]];
    const wk = C.weekly(d);
    for (let w = 1; w <= D.weeks; w++) for (let i = 0; i < 7; i++) {
      const e = d.entries[C.key(w, i)] || {};
      lines.push([w, DAYS[i], e.date || C.autoDate(d.start, w, i), e.weight || "", e.time || "", i === 6 && wk[w - 1].avg != null ? wk[w - 1].avg.toFixed(2) : ""]);
    }
    const csv = lines.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "check-ins.csv"; document.body.appendChild(a); a.click(); a.remove();
  };

  // Redraw the chart when its width crosses the wide/narrow breakpoint (rotation, window resize)
  let wasWide = document.getElementById("chart").clientWidth > 600;
  window.addEventListener("resize", () => {
    const wide = document.getElementById("chart").clientWidth > 600;
    if (wide !== wasWide) { wasWide = wide; renderChart(); }
  });

  renderStats(); renderChart(); renderWeeks();
});
</script>
</body>
</html>
